<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Haven - Welcome</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #30200e);
            font-family: Arial, sans-serif;
            color: white;
        }

        .welcome-box {
            background: #182334;
            padding: 35px;
            width: 90%;
            max-width: 400px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid #d6a84f;
        }

        h1 {
            color: #d6a84f;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #d6a84f;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f0c76c;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="welcome-box">

    <h1>🍽️ Tasty Haven</h1>

    <h3>Welcome to Tasty Haven!</h3>

    <p>Enter your Gmail to continue.</p>

    <input type="email" id="email" placeholder="Your Gmail address">

    <input type="password" id="password" placeholder="Create or enter password">

    <button id="registerButton">Create Account</button>

    <button id="loginButton">Already have an account? Login</button>

    <p id="message"></p>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendEmailVerification,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const message = document.getElementById("message");

onAuthStateChanged(auth, async (user) => {
    if (user) {
        if (user.emailVerified) {
            window.location.replace("home.html");
        } else {
            message.textContent = "Please verify your Gmail before entering.";
            await signOut(auth);
        }
    }
});

function validDetails() {
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!email.endsWith("@gmail.com")) {
        message.textContent = "Please enter a valid Gmail address.";
        return false;
    }

    if (password.length < 6) {
        message.textContent = "Password must contain at least 6 characters.";
        return false;
    }

    return true;
}

document.getElementById("registerButton").addEventListener("click", async () => {

    if (!validDetails()) return;

    try {
        const result = await createUserWithEmailAndPassword(
            auth,
            emailInput.value.trim(),
            passwordInput.value
        );

        await sendEmailVerification(result.user);

        message.textContent = "Verification email sent! Check your Gmail.";

    } catch (error) {
        message.textContent = error.message;
    }

});

document.getElementById("loginButton").addEventListener("click", async () => {

    if (!validDetails()) return;

    try {
        const result = await signInWithEmailAndPassword(
            auth,
            emailInput.value.trim(),
            passwordInput.value
        );

        if (result.user.emailVerified) {
            window.location.href = "home.html";
        } else {
            await sendEmailVerification(result.user);
            await signOut(auth);
            message.textContent = "Please verify your Gmail. A new verification email has been sent.";
        }

    } catch (error) {
        message.textContent = error.message;
    }

});

</script>

</body>
</html>
